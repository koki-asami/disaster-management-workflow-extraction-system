# Deploy backend container (ECR) and frontend (S3 + CloudFront).
# Configure repository variables:
#   BACKEND_API_URL_DEV / BACKEND_API_URL_PROD — public origin for the API (no trailing slash), e.g. https://api.example.com
# push to main -> dev; push tag v* -> prod

name: Deploy to AWS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  backend:
    name: Deploy backend (ECR)
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.meta.outputs.api_url }}
    env:
      STAGE: ${{ github.ref == 'refs/heads/main' && 'dev' || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve ECR registry and API URL
        id: meta
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "registry=${ACCOUNT}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "repo=dmwe-api-${{ env.STAGE }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "api_url=${{ vars.BACKEND_API_URL_DEV }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=${{ vars.BACKEND_API_URL_PROD }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          docker build --platform linux/amd64 -t "$REGISTRY/$REPO:${{ github.sha }}" -t "$REGISTRY/$REPO:latest" backend
          docker push "$REGISTRY/$REPO:${{ github.sha }}"
          docker push "$REGISTRY/$REPO:latest"

      - name: Render task definition with image and secret
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend/ecs-taskdef.json
          container-name: api
          image: ${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.repo }}:${{ github.sha }}
          environment-variables: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: dmwe-${{ env.STAGE }}
          service: dmwe-api-${{ env.STAGE }}
          wait-for-service-stability: true

  frontend:
    name: Deploy frontend (S3 + CloudFront)
    needs: backend
    runs-on: ubuntu-latest
    env:
      FRONTEND_BUCKET: ${{ github.ref == 'refs/heads/main' && 'dmwe-frontend-dev' || 'dmwe-frontend-prod' }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ github.ref == 'refs/heads/main' && vars.CLOUDFRONT_DISTRIBUTION_ID_DEV || vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Ensure API origin is set
        run: |
          if [ -z "$VITE_API_ORIGIN" ]; then
            echo "::error::VITE_API_ORIGIN is empty — set BACKEND_API_URL_DEV / BACKEND_API_URL_PROD repository variables"
            exit 1
          fi
        env:
          VITE_API_ORIGIN: ${{ needs.backend.outputs.api_url }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_ORIGIN: ${{ needs.backend.outputs.api_url }}
          VITE_API_PREFIX: /api/v1
          VITE_COGNITO_DOMAIN: ${{ github.ref == 'refs/heads/main' && vars.VITE_COGNITO_DOMAIN_DEV || vars.VITE_COGNITO_DOMAIN_PROD }}
          VITE_COGNITO_APP_CLIENT_ID: ${{ github.ref == 'refs/heads/main' && vars.VITE_COGNITO_APP_CLIENT_ID_DEV || vars.VITE_COGNITO_APP_CLIENT_ID_PROD }}
          VITE_COGNITO_REDIRECT_URI: ${{ github.ref == 'refs/heads/main' && vars.VITE_COGNITO_REDIRECT_URI_DEV || vars.VITE_COGNITO_REDIRECT_URI_PROD }}
          VITE_COGNITO_LOGOUT_URI: ${{ github.ref == 'refs/heads/main' && vars.VITE_COGNITO_LOGOUT_URI_DEV || vars.VITE_COGNITO_LOGOUT_URI_PROD }}
          CI: "false"

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" --delete
        env:
          FRONTEND_BUCKET: ${{ env.FRONTEND_BUCKET }}

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
