<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Frontend function dependency diagram</title>
  <desc id="desc">Function-level dependency diagram for React components, state handlers, API client functions, authentication, and backend calls.</desc>
  <defs>
